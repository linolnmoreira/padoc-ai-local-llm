<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Padoc AI - Chat</title>

  <!-- Firebase Web SDK (Compat version) -->
  <!-- Usando uma versão mais recente e consistente -->
  <script defer src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Topo */
    header {
      background-color: #1e293b;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .model-selector {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Container de mensagens */
    main#chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      padding: 0.85rem 1.15rem;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .message.user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-bottom-left-radius: 2px;
    }

    .message .sender-tag {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.25rem;
      font-weight: 600;
    }

    /* Área do Prompt / Input */
    .input-area {
      background-color: #0f172a;
      padding: 1rem 1.5rem 1.5rem;
      border-top: 1px solid #1e293b;
    }

    .input-wrapper {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 0.75rem;
      background-color: #1e293b;
      padding: 0.5rem;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    textarea#user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-size: 0.95rem;
      padding: 0.5rem;
      resize: none;
      height: 42px; /* Altura inicial */
      font-family: inherit;
      transition: height 0.2s;
    }

    button#send-btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button#send-btn:hover {
      opacity: 0.9;
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .message {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Padoc AI</h1>
    </div>
    <!-- Seletor de IA / Modelo -->
    <select id="ai-model" class="model-selector" aria-label="Seletor de modelo de IA">
      <option value="padoc-v1">Padoc AI (Padrão)</option>
      <option value="openai-gpt4">OpenAI GPT-4</option>
      <option value="claude-3">Anthropic Claude 3</option>
      <option value="gemini-pro">Google Gemini Pro</option>
    </select>
  </header>
  <main id="chat-container">
    <div class="message bot">
      <span class="sender-tag">Padoc AI</span>
      Olá! Eu sou a Padoc. Como posso te ajudar hoje?
    </div>
  </main>
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="user-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
      <button id="send-btn">Enviar</button>
    </div>
  </div>

  <script>
    async function initializeApp() {
      const chatContainer = document.getElementById('chat-container');
      const userInput = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const modelSelect = document.getElementById('ai-model');

      let firebaseConfig;
      try {
        // Busca a configuração do Firebase do backend para segurança
        const response = await fetch('/api/firebase-config');
        if (!response.ok) {
          throw new Error('Falha ao buscar a configuração do Firebase.');
        }
        firebaseConfig = await response.json();

        if (!firebaseConfig.apiKey) {
            throw new Error('Chave de API do Firebase não encontrada na configuração.');
        }

      } catch (error) {
        console.error("Erro crítico na inicialização:", error);
        const errorDiv = document.createElement('div');
        errorDiv.textContent = 'Erro ao carregar a configuração da aplicação. Por favor, recarregue a página.';
        errorDiv.style.color = 'red';
        document.body.prepend(errorDiv);
        return;
      }

      // Inicializar Firebase
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const analytics = firebase.analytics();

      // IMPORTANTE: A URL da API deve ser a do seu serviço em produção (Render, Heroku, etc.)
      // Para desenvolvimento local, use o endereço do seu servidor Flask.
      // A URL da API será relativa ao domínio atual, funcionando tanto em local quanto em produção.
      const API_URL = "/api/diagnostico";

      // Função para renderizar uma mensagem na tela
      function addMessage(text, sender, modelName = '') {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);

        const tag = document.createElement('span');
        tag.classList.add('sender-tag');
        tag.textContent = sender === 'user' ? 'Você' : (modelName || 'Padoc AI');

        const content = document.createElement('div');
        content.textContent = text;

        msgDiv.appendChild(tag);
        msgDiv.appendChild(content);
        chatContainer.appendChild(msgDiv);

        // Rola automaticamente para o fim do chat
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // Processa o envio da mensagem
      async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        const selectedModel = modelSelect.options[modelSelect.selectedIndex].text;
        const usuario_id = auth.currentUser ? auth.currentUser.uid : 'anonimo-' + Date.now();

        // 1. Adiciona a mensagem do usuário à interface
        addMessage(text, 'user');
        userInput.value = '';
        autoGrow(userInput); // Redimensiona o textarea

        // 2. Adiciona uma mensagem de "pensando..."
        addMessage('Analisando sua pergunta...', 'bot', selectedModel);

        // 3. Chama a API do backend
        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pergunta: text, usuario_id: usuario_id, model: modelSelect.value })
          });

          if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.erro || `HTTP error! status: ${response.status}`);
          }

          const data = await response.json();

          // Remove a mensagem "Analisando..."
          const messages = chatContainer.querySelectorAll('.message.bot');
          messages[messages.length - 1].remove();

          // Adiciona a resposta final da IA
          addMessage(data.resposta, 'bot', selectedModel);

        } catch (error) {
          console.error("Erro ao chamar a API:", error);
          // Remove a mensagem "Analisando..."
          const messages = chatContainer.querySelectorAll('.message.bot');
          messages[messages.length - 1].remove();
          // Adiciona uma mensagem de erro
          addMessage(`Ocorreu um erro ao conectar à IA: ${error.message}`, 'bot');
        }
      }

      // Função para auto-ajustar a altura do textarea
      function autoGrow(element) {
        element.style.height = "5px";
        element.style.height = (element.scrollHeight) + "px";
      }

      // Eventos de clique e enter
      sendBtn.addEventListener('click', handleSend);
      userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });
      userInput.addEventListener('input', () => autoGrow(userInput));

      // Ajusta a altura inicial
      autoGrow(userInput);
    }

    document.addEventListener('DOMContentLoaded', initializeApp);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PADOC AI - Diagnóstico Automotivo Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-diagnostico {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-diagnostico:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-diagnostico:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-limpar {
            background: #f0f0f0;
            color: #333;
        }

        .btn-limpar:hover {
            background: #e0e0e0;
        }

        .resultado {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #28a745;
            background: #f0f8f4;
            display: none;
        }

        .resultado.ativo {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .resultado.erro {
            border-left-color: #dc3545;
            background: #f8f0f0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .resultado h3 {
            color: #28a745;
            margin-bottom: 10px;
        }

        .resultado.erro h3 {
            color: #dc3545;
        }

        .resultado p {
            color: #555;
            line-height: 1.6;
        }

        .loader {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .loader.ativo {
            display: block;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .historico {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .historico h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .historico-item {
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .historico-item .data {
            font-size: 0.9em;
            color: #999;
        }

        .historico-item .pergunta {
            font-weight: 600;
            margin: 5px 0;
            color: #333;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .main-content {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 PADOC AI</h1>
            <p>Diagnóstico Automotivo Inteligente com IA</p>
        </div>

        <div class="main-content">
            <div class="form-group">
                <label for="pergunta">Descreva o problema do seu carro:</label>
                <textarea id="pergunta" placeholder="Ex: Meu carro está fazendo barulho estranho no motor, especialmente ao acelerar..."></textarea>
            </div>

            <div class="form-group">
                <label for="usuario_id">Seu Email (opcional):</label>
                <input type="text" id="usuario_id" placeholder="seu.email@example.com">
            </div>

            <!-- NOVO: Campos para upload de arquivos multimodais -->
            <div class="form-group">
                <label for="pdf_input">Manual Técnico (PDF):</label>
                <input type="file" id="pdf_input" accept=".pdf">
            </div>

            <div class="form-group">
                <label for="video_input">Vídeo do Problema (MP4):</label>
                <input type="file" id="video_input" accept="video/mp4">
            </div>

            <div class="form-group">
                <label for="wiring_input">Esquema Elétrico (PDF/Imagem):</label>
                <input type="file" id="wiring_input" accept=".pdf,image/*">
            </div>

            <div class="form-group">
                <label for="obd_code">Código de Falha (OBD):</label>
                <input type="text" id="obd_code" placeholder="Ex: P0300">
            </div>

            <div class="button-group">
                <button class="btn-diagnostico" onclick="enviarPergunta()">
                    Obter Diagnóstico
                </button>
                <button class="btn-limpar" onclick="limpar()">
                    Limpar
                </button>
            </div>

            <div class="loader" id="loader">
                <div class="spinner"></div>
                <p>Analisando seu problema...</p>
            </div>

            <div class="resultado" id="resultado"></div>

            <div class="historico" id="historicoDiv" style="display: none;">
                <h3>📋 Seu Histórico</h3>
                <div id="historico-list"></div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 PADOC AI - Todos os direitos reservados</p>
            <p><a href="#" style="color: inherit; text-decoration: none;">Política de Privacidade</a> | 
               <a href="#" style="color: inherit; text-decoration: none;">Termos de Uso</a></p>
        </div>
    </div>

    <script>
        // Configurar URL da API para testes locais
        // Use "http://localhost:5000/api/diagnostico" quando o backend estiver rodando localmente.
        // const API_URL = "http://localhost:5000/api/diagnostico"; // URL para testes locais
        // IMPORTANTE: Substitua a URL abaixo pela URL da sua API em produção (Heroku)!
        const API_URL = "https://padoc-ai-api.herokuapp.com/api/diagnostico";
        const HISTORICO_KEY = "padoc_historico";

        async function enviarPergunta() {
            const pergunta = document.getElementById("pergunta").value.trim();
            const usuario_id = document.getElementById("usuario_id").value.trim() || "anonimo";
            // NOVO: Capturar valores dos novos campos
            const obd_code = document.getElementById("obd_code").value.trim();
            const pdf_file = document.getElementById("pdf_input").files[0];
            const video_file = document.getElementById("video_input").files[0];
            const wiring_file = document.getElementById("wiring_input").files[0];
            
            // Validação
            if (!pergunta && !obd_code && !pdf_file && !video_file && !wiring_file) {
                mostrarErro("Por favor, descreva o problema ou forneça um arquivo/código OBD para análise.");
                return;
            }

            // A validação de tamanho mínimo só faz sentido se a pergunta for o único input
            if (pergunta && pergunta.length < 10 && !obd_code && !pdf_file && !video_file && !wiring_file) {
                mostrarErro("Descreva o problema com mais detalhes (mínimo 10 caracteres)");
                return;
            }

            // Mostrar loader
            document.getElementById("loader").classList.add("ativo");

            try {
                const resposta = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        pergunta: pergunta,
                        usuario_id: usuario_id,
                        codigo_obd: obd_code,
                        // NOTA: Em uma aplicação web real, você faria o upload dos arquivos
                        // para um endpoint, que retornaria os caminhos no servidor.
                        // Aqui, estamos simulando o envio dos nomes dos arquivos, assumindo
                        // que a API sabe onde encontrá-los (cenário de desenvolvimento).
                        pdf_path: pdf_file ? pdf_file.name : "",
                        video_path: video_file ? video_file.name : "",
                        wiring_path: wiring_file ? wiring_file.name : ""
                    })
                });

                const dados = await resposta.json();

                if (dados.sucesso) {
                    mostrarSucesso(dados.resposta);
                    salvarNoHistorico(pergunta, dados.resposta);
                    // Não limpa os campos para permitir refazer a pergunta com os mesmos arquivos
                    document.getElementById("pergunta").value = "";
                } else {
                    mostrarErro(dados.erro || "Erro ao processar sua pergunta");
                }
            } catch (erro) {
                mostrarErro("Erro ao conectar com a API: " + erro.message);
            } finally {
                document.getElementById("loader").classList.remove("ativo");
            }
        }

        function mostrarSucesso(resposta) {
            const div = document.getElementById("resultado");
            let respostaFormatada = "";

            // MELHORIA: Verifica se a resposta é um JSON para formatá-la corretamente
            try {
                const obj = JSON.parse(resposta);
                respostaFormatada = `<pre>${JSON.stringify(obj, null, 2)}</pre>`;
            } catch (e) {
                // Se não for JSON, trata como texto normal e substitui quebras de linha
                respostaFormatada = resposta.replace(/\n/g, '<br>');
            }

            div.className = "resultado ativo";
            div.innerHTML = `
                <h3>✓ Diagnóstico</h3>
                <p>${respostaFormatada}</p>
            `;
        }

        function mostrarErro(mensagem) {
            const div = document.getElementById("resultado");
            div.className = "resultado ativo erro";
            div.innerHTML = `
                <h3>✗ Erro</h3>
                <p>${mensagem}</p>
            `;
        }

        function limpar() {
            document.getElementById("pergunta").value = "";
            document.getElementById("usuario_id").value = "";
            document.getElementById("resultado").className = "resultado";
            // NOVO: Limpar os novos campos
            document.getElementById("obd_code").value = "";
            document.getElementById("pdf_input").value = "";
            document.getElementById("video_input").value = "";
            document.getElementById("wiring_input").value = "";
            document.getElementById("resultado").innerHTML = "";
        }

        function salvarNoHistorico(pergunta, resposta) {
            const historico = JSON.parse(localStorage.getItem(HISTORICO_KEY) || "[]");
            historico.unshift({
                pergunta: pergunta,
                resposta: resposta.substring(0, 100) + "...",
                data: new Date().toLocaleString("pt-BR")
            });

            // Manter apenas últimos 10 registros
            historico.splice(10);

            localStorage.setItem(HISTORICO_KEY, JSON.stringify(historico));
            atualizarHistoricoUI();
        }

        function atualizarHistoricoUI() {
            const historico = JSON.parse(localStorage.getItem(HISTORICO_KEY) || "[]");

            if (historico.length > 0) {
                document.getElementById("historicoDiv").style.display = "block";
                let html = "";

                historico.forEach((item, index) => {
                    html += `
                        <div class="historico-item">
                            <div class="data">${item.data}</div>
                            <div class="pergunta">${item.pergunta}</div>
                            <div>${item.resposta}</div>
                        </div>
                    `;
                });

                document.getElementById("historico-list").innerHTML = html;
            }
        }

        // Carregar histórico ao abrir a página
        window.addEventListener("load", atualizarHistoricoUI);
    </script>
</body>
</html>
